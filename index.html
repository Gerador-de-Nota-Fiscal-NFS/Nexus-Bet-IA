
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <base target="_self">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus IA — Análise Esportiva Inteligente</title>
    <meta name="description" content="Plataforma avançada de análise esportiva com inteligência artificial integrada e gestão inteligente de apostas.">
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #7c3aed;
            --primary-light: #a78bfa;
            --primary-dark: #5b21b6;
            --accent: #f59e0b;
            --accent-light: #fbbf24;
            --surface: #0f0e17;
            --surface-card: #1a1932;
            --surface-card-hover: #23214a;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #2d2b55;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --shadow-glow: 0 0 40px rgba(124, 58, 237, 0.15);
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font-sans);
            background: var(--surface);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--surface);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
        .glass {
            background: rgba(26, 25, 50, 0.72);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .glass-light {
            background: rgba(26, 25, 50, 0.50);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .card-hover {
            transition: all 0.25s ease;
        }
        .card-hover:hover {
            background: var(--surface-card-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 32px rgba(124, 58, 237, 0.35);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.10);
            border-color: var(--text-muted);
        }
        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .badge-success {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }
        .badge-danger {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }
        .badge-warning {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
        }
        .badge-primary {
            background: rgba(124, 58, 237, 0.15);
            color: var(--primary-light);
        }
        .input-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: var(--font-sans);
            transition: all 0.2s ease;
            outline: none;
        }
        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
        }
        .input-field::placeholder {
            color: var(--text-muted);
        }
        .input-field-sm {
            padding: 8px 12px;
            font-size: 0.8rem;
        }
        .skeleton {
            background: linear-gradient(90deg, var(--surface-card) 25%, rgba(255, 255, 255, 0.04) 50%, var(--surface-card) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-xs);
        }
        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }
        .typing-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary-light);
            margin: 0 3px;
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dots span:nth-child(1) {
            animation-delay: 0s;
        }
        .typing-dots span:nth-child(2) {
            animation-delay: 0.16s;
        }
        .typing-dots span:nth-child(3) {
            animation-delay: 0.32s;
        }
        @keyframes typing {
            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.4;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .fade-in {
            animation: fadeIn 0.3s ease forwards;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .slide-in-left {
            animation: slideInLeft 0.3s ease forwards;
        }
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .message-content p {
            margin-bottom: 8px;
            line-height: 1.7;
        }
        .message-content p:last-child {
            margin-bottom: 0;
        }
        .message-content strong {
            color: var(--primary-light);
            font-weight: 600;
        }
        .message-content ul {
            list-style: disc;
            padding-left: 24px;
            margin: 8px 0;
        }
        .message-content li {
            margin-bottom: 4px;
            color: var(--text-secondary);
        }
        .message-content code {
            background: rgba(124, 58, 237, 0.12);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            color: var(--accent-light);
        }
        .message-content .bet-card-inline {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin: 12px 0;
        }
        .message-content .bet-card-inline .odds {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent);
        }
        .message-content .bet-card-inline .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        /* sidebar transitions */
        .sidebar {
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                width: 280px;
                z-index: 100;
                transform: translateX(-100%);
                opacity: 0;
            }
            .sidebar.open {
                transform: translateX(0);
                opacity: 1;
            }
            .sidebar-overlay {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.5);
                z-index: 99;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s ease;
            }
            .sidebar-overlay.open {
                opacity: 1;
                pointer-events: all;
            }
        }
        @media (min-width: 769px) {
            .sidebar {
                transform: translateX(0) !important;
                opacity: 1 !important;
            }
            .sidebar-overlay {
                display: none !important;
            }
        }
        .animate-pulse-glow {
            animation: pulseGlow 2s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(124, 58, 237, 0.1);
            }
            50% {
                box-shadow: 0 0 40px rgba(124, 58, 237, 0.25);
            }
        }
        .conf-bar {
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(90deg, var(--danger), var(--warning), var(--success));
            transition: width 0.6s ease;
        }
        .chart-bar {
            height: 120px;
            display: flex;
            align-items: flex-end;
            gap: 4px;
        }
        .chart-bar-item {
            flex: 1;
            border-radius: 4px 4px 0 0;
            min-height: 4px;
            transition: height 0.6s ease;
            background: linear-gradient(180deg, var(--primary-light), var(--primary));
        }
        /* scrollable chat */
        .chat-scroll {
            scroll-behavior: smooth;
        }
        .chat-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }
        /* tabs */
        .tab-active {
            background: rgba(124, 58, 237, 0.15);
            color: var(--primary-light);
            border-color: rgba(124, 58, 237, 0.3);
        }
        /* mobile bottom nav */
        .mobile-nav-item {
            transition: all 0.2s ease;
        }
        .mobile-nav-item.active {
            color: var(--primary-light);
        }
        .mobile-nav-item.active i {
            color: var(--primary-light);
        }
        @media (min-width: 769px) {
            .mobile-bottom-nav {
                display: none !important;
            }
        }
    </style>
</head>

<script>

    };

    firebase.initializeApp(firebaseConfig);

    // ============================================================
    // 2. DATA LAYER

    // Navigation items
    const navItems = [
        { id: 'dashboard', label: 'Dashboard', icon: 'fa-gauge-high', view: 'dashboard' },
        { id: 'chat', label: 'Nexus IA', icon: 'fa-robot', view: 'chat' },
        { id: 'tickets', label: 'Gerador de Bilhetes', icon: 'fa-ticket', view: 'tickets' },
        { id: 'history', label: 'Histórico', icon: 'fa-clock-rotate', view: 'history' },
    ];

    const mobileNavItems = navItems;

    // Dashboard stats cards (will be updated dynamically)
    const defaultStats = [
        { label: 'Saldo da Banca', value: 'R$ 0,00', icon: 'fa-wallet', color: 'text-[var(--success)]' },
        { label: 'Bilhetes Gerados', value: '0', icon: 'fa-ticket', color: 'text-[var(--primary-light)]' },
        { label: 'Taxa de Acerto', value: '0%', icon: 'fa-bullseye', color: 'text-[var(--accent)]' },
        { label: 'Lucro Total', value: 'R$ 0,00', icon: 'fa-chart-line', color: 'text-[var(--success)]' },
    ];

    // Chat initial suggestions
    const chatSuggestions = [
        'Analise o próximo jogo do Brasileirão',
        'Sugira um bilhete para hoje',
        'Qual a melhor estratégia de banca?',
        'Estatísticas: Flamengo vs Palmeiras',
    ];

    // RapidAPI config
    const RAPID_API_KEY = 'e9e2276e06msh79a626961eabab5p1317b2jsn2d38f8735d8a';
    const RAPID_API_HOST = 'free-api-live-football-data.p.rapidapi.com';

    // ============================================================
    // 3. STATE
    // ============================================================
    let currentUser = null;
    let currentView = 'dashboard';
    let userProfile = null; // { bankroll: number, email: string, ... }
    let chatMessages = [];
    let isTyping = false;
    let ticketsHistory = [];
    let isLoadingTickets = false;
    let isLoadingChat = false;

    // ============================================================
    // 4. RENDER FUNCTIONS
    // ============================================================

    function renderNav(items, activeId) {
        return items.map(item => `
            <button class="nav-link w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-200
                ${activeId === item.id ? 'bg-[var(--primary)]/15 text-[var(--primary-light)] border border-[var(--primary)]/20' : 'text-[var(--text-secondary)] hover:text-[var(--text-primary)] hover:bg-white/5 border border-transparent'}"
                data-view="${item.view}" data-nav="${item.id}">
                <i class="fas ${item.icon} text-base ${activeId === item.id ? 'text-[var(--primary-light)]' : ''}"></i>
                <span>${item.label}</span>
            </button>
        `).join('');
    }

    function renderMobileNav(items, activeId) {
        return items.map(item => `
            <button class="mobile-nav-item flex flex-col items-center gap-0.5 py-2 px-3 rounded-xl text-[10px] font-medium
                ${activeId === item.id ? 'text-[var(--primary-light)]' : 'text-[var(--text-muted)]'}"
                data-view="${item.view}" data-nav="${item.id}">
                <i class="fas ${item.icon} text-lg ${activeId === item.id ? 'text-[var(--primary-light)]' : ''}"></i>
                <span>${item.label}</span>
            </button>
        `).join('');
    }

    function renderStats(stats) {
        return stats.map(s => `
            <div class="glass-light rounded-2xl p-5 card-hover">
                <div class="flex items-start justify-between">
                    <div>
                        <p class="text-xs text-[var(--text-muted)] uppercase tracking-wider">${s.label}</p>
                        <p class="text-2xl font-bold mt-1 ${s.color}">${s.value}</p>
                    </div>
                    <div class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center ${s.color}">
                        <i class="fas ${s.icon} text-lg"></i>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function renderTicketsTable(tickets) {
        if (!tickets || tickets.length === 0) {
            return `
                <div class="text-center py-12 text-[var(--text-muted)]">
                    <i class="fas fa-ticket text-4xl mb-4 opacity-30"></i>
                    <p class="font-medium">Nenhum bilhete gerado ainda</p>
                    <p class="text-sm">Crie seu primeiro bilhete no chat com a Nexus IA!</p>
                </div>
            `;
        }
        return tickets.slice().reverse().map(t => `
            <div class="glass-light rounded-xl p-4 card-hover fade-in">
                <div class="flex items-start justify-between gap-3 flex-wrap">
                    <div class="flex-1 min-w-0">
                        <p class="font-semibold text-sm">${t.match || 'Partida personalizada'}</p>
                        <p class="text-xs text-[var(--text-muted)] mt-0.5">${t.pick || 'Palpite'}</p>
                        <div class="flex items-center gap-3 mt-2 flex-wrap">
                            <span class="badge badge-primary"><i class="fas fa-arrow-up mr-1"></i>Odd: ${t.odd || '—'}</span>
                            <span class="badge badge-warning"><i class="fas fa-percent mr-1"></i>Conf: ${t.confidence || '—'}</span>
                            <span class="badge badge-success"><i class="fas fa-coins mr-1"></i>Retorno: ${t.potentialReturn || 'R$ 0,00'}</span>
                        </div>
                    </div>
                    <div class="text-right shrink-0">
                        <p class="text-xs text-[var(--text-muted)]">${t.createdAt ? new Date(t.createdAt.toDate ? t.createdAt.toDate() : t.createdAt).toLocaleDateString('pt-BR') : '—'}</p>
                        <span class="badge ${t.status === 'win' ? 'badge-success' : t.status === 'loss' ? 'badge-danger' : 'badge-warning'} mt-1">
                            ${t.status === 'win' ? '✅ Ganhou' : t.status === 'loss' ? '❌ Perdeu' : '⏳ Pendente'}
                        </span>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function renderChatMessages(messages, isTyping) {
        if (!messages || messages.length === 0) {
            return `
                <div class="flex-1 flex items-center justify-center p-8">
                    <div class="text-center max-w-md">
                        <div class="w-16 h-16 rounded-2xl bg-[var(--primary)]/10 flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-robot text-3xl text-[var(--primary-light)]"></i>
                        </div>
                        <h3 class="text-lg font-bold mb-2">Nexus IA</h3>
                        <p class="text-sm text-[var(--text-secondary)]">Análise esportiva inteligente ao seu alcance. Pergunte sobre partidas, peça sugestões de bilhetes ou gerencie sua banca.</p>
                        <div class="flex flex-wrap gap-2 mt-6 justify-center" id="suggestionChips">
                            ${chatSuggestions.map(s => `<button class="suggestion-chip px-4 py-2 rounded-full bg-white/5 hover:bg-white/10 text-xs font-medium text-[var(--text-secondary)] hover:text-[var(--text-primary)] border border-[var(--border)] transition-all">${s}</button>`).join('')}
                        </div>
                    </div>
                </div>
            `;
        }
        return messages.map((msg, idx) => {

    function buildDashboard() {
        const stats = defaultStats.map(s => ({ ...s }));
        if (userProfile && userProfile.bankroll > 0) {
            stats[0].value = `R$ ${userProfile.bankroll.toFixed(2)}`;
            const totalTickets = ticketsHistory.length;
            stats[1].value = String(totalTickets);
            const wins = ticketsHistory.filter(t => t.status === 'win').length;
            stats[2].value = totalTickets > 0 ? `${((wins / totalTickets) * 100).toFixed(0)}%` : '0%';
            const profit = ticketsHistory.reduce((acc, t) => {
                if (t.status === 'win') {
                    const ret = parseFloat(t.potentialReturn ? t.potentialReturn.replace('R$ ', '').replace('.', '').replace(',', '.') :
                        0);
                    const stake = t.stake || 0;
                    return acc + (ret - stake);
                }
                if (t.status === 'loss') return acc - (t.stake || 0);
                return acc;
            }, 0);
            stats[3].value = `R$ ${profit.toFixed(2)}`;
            stats[3].color = profit >= 0 ? 'text-[var(--success)]' : 'text-[var(--danger)]';
        }

        return `

    // ============================================================
    // 6. MOUNT FUNCTIONS

    function mountView(view) {
        currentView = view;
        const main = document.getElementById('mainContent');
        let html = '';
        switch (view) {
            case 'dashboard':
                html = buildDashboard();
                break;
            case 'chat':
                html = buildChat();
                break;
            case 'tickets':
                html = buildTickets();
                break;
            case 'history':
                html = buildHistory();
                break;
            default:
                html = buildDashboard();
        }
        main.innerHTML = html;

        // Update navs
        document.querySelectorAll('[data-nav]').forEach(el => {
            const isActive = el.dataset.nav === view;
            if (el.classList.contains('nav-link')) {
                el.classList.toggle('bg-[var(--primary)]/15', isActive);
                el.classList.toggle('text-[var(--primary-light)]', isActive);
                el.classList.toggle('border-[var(--primary)]/20', isActive);
                el.classList.toggle('text-[var(--text-secondary)]', !isActive);
                el.classList.toggle('hover:text-[var(--text-primary)]', !isActive);
                el.classList.toggle('hover:bg-white/5', !isActive);
                el.classList.toggle('border-transparent', !isActive);
            }
            if (el.classList.contains('mobile-nav-item')) {
                el.classList.toggle('text-[var(--primary-light)]', isActive);
                el.classList.toggle('text-[var(--text-muted)]', !isActive);
                const icon = el.querySelector('i');
                if (icon) {
                    icon.classList.toggle('text-[var(--primary-light)]', isActive);
                }
            }
        });

        // Mount sub-views
        if (view === 'chat') {
            mountChat();
        }
        if (view === 'tickets') {
            mountTickets();
        }
        if (view === 'dashboard') {
            mountDashboard();
        }
        if (view === 'history') {
            mountHistory();
        }

        // Re-bind navigation
        bindNavClicks();
    }

    function bindNavClicks() {
        document.querySelectorAll('[data-view]').forEach(el => {
            el.removeEventListener('click', onNavClick);
            el.addEventListener('click', onNavClick);
        });
    }

    function onNavClick(e) {
        const view = e.currentTarget.dataset.view;
        if (view) {
            if (view === 'chat' && !currentUser) {
                showToast('Faça login para acessar o chat', 'warning');
                return;
            }
            if (view === 'tickets' && !currentUser) {
                showToast('Faça login para gerar bilhetes', 'warning');
                return;
            }
            mountView(view);
            // Close sidebar on mobile
            if (window.innerWidth < 769) {
                toggleSidebar(false);
            }
        }
    }

    function mountDashboard() {
        const saveBtn = document.getElementById('saveBankrollBtn');
        const input = document.getElementById('bankrollInput');
        if (saveBtn && input) {
            saveBtn.addEventListener('click', async () => {
                const val = parseFloat(input.value);
                if (isNaN(val) || val < 0) {
                    showToast('Insira um valor válido para a banca', 'error');
                    return;
                }
                if (!currentUser) {
                    showToast('Faça login para salvar', 'warning');
                    return;
                }
                try {
                    await db.collection('users').doc(currentUser.uid).set({
                        bankroll: val,
                        email: currentUser.email,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                    userProfile = { ...userProfile, bankroll: val };
                    showToast('Banca salva com sucesso!', 'success');
                    mountView('dashboard');
                } catch (err) {
                    showToast('Erro ao salvar: ' + err.message, 'error');
                }
            });
        }
        const authBtn = document.getElementById('showAuthBtn');
        if (authBtn) {
            authBtn.addEventListener('click', showAuthModal);
        }
    }

    // ============================================================
    // 8. CHAT LOGIC
    // ============================================================

    let chatListener = null;

    function mountChat() {
        const container = document.getElementById('chatMessagesContainer');
        const input = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendChatBtn');

        // Load messages
        loadChatMessages();

        // Suggestion chips
        document.querySelectorAll('.suggestion-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                if (!currentUser) { showToast('Faça login para conversar', 'warning'); return; }
                const text = chip.textContent.trim();
                sendMessage(text);
            });
        });

        if (sendBtn && input) {
            sendBtn.addEventListener('click', () => {
                if (!currentUser) { showToast('Faça login para conversar', 'warning'); return; }
                const text = input.value.trim();
                if (text) {
                    sendMessage(text);
                    input.value = '';
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendBtn.click();
                }
            });
        }
    }

    async function loadChatMessages() {
        if (!currentUser) return;
        const container = document.getElementById('chatMessagesContainer');
        if (!container) return;

        // Unsubscribe previous listener
        if (chatListener) { chatListener(); }

        try {
            const q = db.collection('users').doc(currentUser.uid)
                .collection('chats').doc('main')
                .collection('messages')
                .orderBy('createdAt', 'asc')
                .limit(100);

            chatListener = q.onSnapshot((snapshot) => {
                const msgs = [];
                snapshot.forEach(doc => {
                    msgs.push({ id: doc.id, ...doc.data() });
                });
                chatMessages = msgs;
                if (container) {
                    container.innerHTML = renderChatMessages(msgs, isTyping);
                    container.scrollTop = container.scrollHeight;
                }
                // Re-bind suggestion chips after render
                document.querySelectorAll('.suggestion-chip').forEach(chip => {
                    chip.removeEventListener('click', onSuggestionChip);
                    chip.addEventListener('click', onSuggestionChip);
                });
            }, (err) => {
                console.warn('Chat listener error:', err);
                if (container) {
                    container.innerHTML = `
                        <div class="flex-1 flex items-center justify-center p-8">
                            <div class="text-center text-[var(--text-muted)]">
                                <i class="fas fa-triangle-exclamation text-3xl mb-3"></i>
                                <p>Erro ao carregar mensagens</p>
                                <button class="btn-secondary mt-3" onclick="loadChatMessages()">Tentar novamente</button>
                            </div>
                        </div>
                    `;
                }
            });
        } catch (err) {
            console.warn('Chat load error:', err);
        }
    }

    function onSuggestionChip(e) {
        if (!currentUser) { showToast('Faça login para conversar', 'warning'); return; }
        const text = e.currentTarget.textContent.trim();
        sendMessage(text);
    }

    async function sendMessage(text) {
        if (!currentUser || !text.trim()) return;
        const container = document.getElementById('chatMessagesContainer');
        if (!container) return;

        // Add user message
        const userMsg = {
            role: 'user',
            content: text,
            createdAt: new Date()
        };

        try {
            await db.collection('users').doc(currentUser.uid)
                .collection('chats').doc('main')
                .collection('messages')
                .add({
                    role: 'user',
                    content: text,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
        } catch (err) {
            console.warn('Error saving message:', err);
        }

        // Show typing
        isTyping = true;
        if (container) {
            container.innerHTML = renderChatMessages(chatMessages, true);
            container.scrollTop = container.scrollHeight;
        }

        // Generate AI response
        const aiResponse = await generateAIResponse(text);

        isTyping = false;

        try {
            await db.collection('users').doc(currentUser.uid)
                .collection('chats').doc('main')
                .collection('messages')
                .add({
                    role: 'assistant',
                    content: aiResponse,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
        } catch (err) {
            console.warn('Error saving AI response:', err);
        }
    }

    let authModal = null;

    function showAuthModal() {
        if (authModal) { authModal.remove();
            authModal = null; return; }
        const overlay = document.createElement('div');
        overlay.className = 'fixed inset-0 z-[150] flex items-center justify-center p-4';
        overlay.style.background = 'rgba(0,0,0,0.6)';
        overlay.style.backdropFilter = 'blur(8px)';
        overlay.innerHTML = `
            <div class="glass rounded-2xl w-full max-w-md p-8 fade-in relative">
                <button class="absolute top-4 right-4 text-[var(--text-muted)] hover:text-[var(--text-primary)] text-xl" id="closeAuthModal">&times;</button>
                <div class="text-center mb-6">
                    <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-[var(--primary)] to-[var(--accent)] flex items-center justify-center text-white font-bold text-lg mx-auto mb-3">N</div>
                    <h2 class="text-xl font-bold">Nexus IA</h2>
                    <p class="text-sm text-[var(--text-secondary)] mt-1">Entre ou crie sua conta</p>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="text-xs text-[var(--text-muted)] block mb-1">Email</label>
                        <input id="authEmail" type="email" placeholder="seu@email.com" class="input-field">
                    </div>
                    <div>
                        <label class="text-xs text-[var(--text-muted)] block mb-1">Senha</label>
                        <input id="authPassword" type="password" placeholder="••••••••" class="input-field">
                    </div>
                    <div class="flex gap-3">
                        <button id="authLoginBtn" class="btn-primary flex-1 justify-center"><i class="fas fa-right-to-bracket"></i> Entrar</button>
                        <button id="authRegisterBtn" class="btn-secondary flex-1 justify-center"><i class="fas fa-user-plus"></i> Cadastrar</button>
                    </div>
                    <p id="authError" class="text-xs text-[var(--danger)] text-center hidden"></p>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
        authModal = overlay;

        document.getElementById('closeAuthModal')?.addEventListener('click', () => { authModal.remove();
            authModal = null; });
        overlay.addEventListener('click', (e) => { if (e.target === overlay) { authModal.remove();
                authModal = null; } });

        const emailInput = document.getElementById('authEmail');
        const passInput = document.getElementById('authPassword');
        const errorEl = document.getElementById('authError');

        const login = async () => {
            const email = emailInput.value.trim();
            const pass = passInput.value;
            if (!email || !pass) { showError('Preencha todos os campos'); return; }
            try {
                await auth.signInWithEmailAndPassword(email, pass);
                showToast('Login realizado!', 'success');
                authModal.remove();
                authModal = null;
            } catch (err) {
                showError(err.message);
            }
        };

        const register = async () => {
            const email = emailInput.value.trim();
            const pass = passInput.value;
            if (!email || !pass) { showError('Preencha todos os campos'); return; }
            if (pass.length < 6) { showError('Senha deve ter no mínimo 6 caracteres'); return; }
            try {
                await auth.createUserWithEmailAndPassword(email, pass);
                showToast('Conta criada com sucesso!', 'success');
                authModal.remove();
                authModal = null;
            } catch (err) {
                showError(err.message);
            }
        };

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.classList.remove('hidden');
            setTimeout(() => errorEl.classList.add('hidden'), 4000);
        }

        document.getElementById('authLoginBtn')?.addEventListener('click', login);
        document.getElementById('authRegisterBtn')?.addEventListener('click', register);
        emailInput?.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
        passInput?.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
    }

    // ============================================================
    // 12. DATA LOADERS
    // ============================================================

    async function loadTicketsHistory() {
        if (!currentUser) return;
        try {
            const snap = await db.collection('users').doc(currentUser.uid)
                .collection('tickets')
                .orderBy('createdAt', 'desc')
                .limit(100)
                .get();

            ticketsHistory = [];
            snap.forEach(doc => {
                ticketsHistory.push({ id: doc.id, ...doc.data() });
            });

            // Update any view that shows tickets
            const historyList = document.getElementById('historyList');
            if (historyList) {
                historyList.innerHTML = renderTicketsTable(ticketsHistory);
            }
            const recentList = document.getElementById('recentTicketsList');
            if (recentList) {
                recentList.innerHTML = renderTicketsTable(ticketsHistory.slice(-5));
            }
            // Update dashboard stats if visible
            if (currentView === 'dashboard') {
                const statsGrid = document.getElementById('statsGrid');
                if (statsGrid) {
                    const stats = defaultStats.map(s => ({ ...s }));
                    if (userProfile?.bankroll > 0) {
                        stats[0].value = `R$ ${userProfile.bankroll.toFixed(2)}`;
                        stats[1].value = String(ticketsHistory.length);
                        const wins = ticketsHistory.filter(t => t.status === 'win').length;
                        stats[2].value = ticketsHistory.length > 0 ? `${((wins / ticketsHistory.length) * 100).toFixed(0)}%` :
                        '0%';
                        const profit = ticketsHistory.reduce((acc, t) => {
                            if (t.status === 'win') {
                                const ret = parseFloat(t.potentialReturn ? t.potentialReturn.replace('R$ ', '').replace('.', '')
                                    .replace(',', '.') : 0);
                                const stk = t.stake || 0;
                                return acc + (ret - stk);
                            }
                            if (t.status === 'loss') return acc - (t.stake || 0);
                            return acc;
                        }, 0);
                        stats[3].value = `R$ ${profit.toFixed(2)}`;
                        stats[3].color = profit >= 0 ? 'text-[var(--success)]' : 'text-[var(--danger)]';
                    }
                    statsGrid.innerHTML = renderStats(stats);
                }
            }
        } catch (err) {
            console.warn('Error loading tickets:', err);
        }
    }

    async function loadUserProfile() {
        if (!currentUser) return;
        try {
            const doc = await db.collection('users').doc(currentUser.uid).get();
            if (doc.exists) {
                userProfile = doc.data();
            } else {
                userProfile = { bankroll: 0, email: currentUser.email };
                await db.collection('users').doc(currentUser.uid).set({
                    bankroll: 0,
                    email: currentUser.email,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
        } catch (err) {
            console.warn('Error loading profile:', err);
            userProfile = { bankroll: 0, email: currentUser.email };
        }
    }

    // ============================================================
    // 13. TOAST
    // ============================================================

    function showToast(message, type = 'info') {
        const container = document.getElementById('toastContainer');
        const colors = {
            success: 'bg-[var(--success)]/20 border-[var(--success)]/40 text-[var(--success)]',
            error: 'bg-[var(--danger)]/20 border-[var(--danger)]/40 text-[var(--danger)]',
            warning: 'bg-[var(--warning)]/20 border-[var(--warning)]/40 text-[var(--warning)]',
            info: 'bg-[var(--primary)]/20 border-[var(--primary)]/40 text-[var(--primary-light)]',
        };
        const icons = {
            success: 'fa-circle-check',
            error: 'fa-circle-xmark',
            warning: 'fa-triangle-exclamation',
            info: 'fa-circle-info',
        };
        const el = document.createElement('div');
        el.className =
            `pointer-events-auto flex items-center gap-3 px-5 py-3 rounded-xl border backdrop-blur-md fade-in ${colors[type] || colors.info}`;
        el.innerHTML = `
            <i class="fas ${icons[type] || icons.info}"></i>
            <span class="text-sm font-medium flex-1">${message}</span>
            <button class="opacity-60 hover:opacity-100 text-sm">&times;</button>
        `;
        el.querySelector('button')?.addEventListener('click', () => el.remove());
        container.appendChild(el);
        setTimeout(() => {
            if (el.parentNode) {
                el.style.opacity = '0';
                el.style.transition = 'opacity 0.3s ease';
                setTimeout(() => el.remove(), 300);
            }
        }, 4000);
    }

    function toggleSidebar(force) {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        overlay.classList.toggle('open', isOpen);

    // ============================================================

    function updateSidebarUser() {
        const nameEl = document.getElementById('sidebarUserName');
        const emailEl = document.getElementById('sidebarUserEmail');
        if (currentUser) {
            nameEl.textContent = currentUser.email?.split('@')[0] || 'Usuário';

    function initApp() {
        // Render sidebar nav
        document.getElementById('sidebarNav').innerHTML = renderNav(navItems, 'dashboard');
        document.getElementById('mobileBottomNav').innerHTML = renderMobileNav(mobileNavItems, 'dashboard');

        // Bind logout
        document.getElementById('logoutBtn')?.addEventListener('click', async () => {
            try {
                await auth.signOut();
                showToast('Sessão encerrada', 'info');
            } catch (err) {
                showToast('Erro ao sair: ' + err.message, 'error');
            }
        });

        // Auth state listener
        auth.onAuthStateChanged(async (user) => {
            currentUser = user;
            updateSidebarUser();
            if (user) {
                await loadUserProfile();
                await loadTicketsHistory();
                if (currentView === 'chat') {
                    loadChatMessages();
                }
                // Refresh current view
                mountView(currentView);
            } else {
                userProfile = null;
                ticketsHistory = [];
                chatMessages = [];
                if (chatListener) { chatListener();
                    chatListener = null; }
                mountView(currentView);
            }
        });

        // Initial view
        mountView('dashboard');

        // Close sidebar on resize
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 769) {
                document.getElementById('sidebar').classList.add('open');
                document.getElementById('sidebarOverlay').classList.remove('open');
            } else {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('open');
            }
        });
        if (window.innerWidth >= 769) {
            document.getElementById('sidebar').classList.add('open');
        }
    }

    document.addEventListener('DOMContentLoaded', initApp);

    // Global for inline onclick
    window.toggleSidebar = toggleSidebar;
    window.showAuthModal = showAuthModal;

    console.log('🚀 Nexus IA — Plataforma de Análise Esportiva Inteligente');
    console.log('📊 Versão 1.0.0');
</script>
